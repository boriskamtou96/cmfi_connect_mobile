# A tag v* (made by `bundle exec fastlane bump`) publishes the version: the
# tests first, then Google Play (internal track) and TestFlight, each with the
# notes of store/release_notes. Can also be started by hand (Actions › Release).
#
# Secrets (Settings › Secrets and variables › Actions), see the README:
#   DOT_ENV                     the .env of the app
#   REVENUE_CAT_APPLE_API_KEY, REVENUE_CAT_GOOGLE_API_KEY   the public RevenueCat
#                               keys (Premium sold in the stores), added to .env
#   ANDROID_KEYSTORE_BASE64     the upload key of Google Play (.jks), in base64
#   ANDROID_KEY_PROPERTIES      the content of android/key.properties
#                               (storeFile=upload-keystore.jks)
#   PLAY_JSON_KEY               the JSON key of the Google Play service account
#   ASC_KEY_ID, ASC_ISSUER_ID   the App Store Connect API key
#   ASC_KEY_P8                  its .p8 file, in base64
#   MATCH_GIT_URL               the private repository of match
#   MATCH_PASSWORD              the passphrase of match
#   MATCH_GIT_BASIC_AUTHORIZATION   base64 of "user:token" to read that repository
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which store to send to (a tag always does both)
        type: choice
        options: [all, ios, android]
        default: all

jobs:
  test:
    # v1.0.0 marks the first release, built and sent by hand on 2026-10-25:
    # nothing to publish again (the stores refuse a build number twice)
    if: github.ref_name != 'v1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    if: ${{ inputs.platform != 'ios' }}
    # the secrets of the store live in the « Env » environment, not in the repository
    environment: Env
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Secrets of the build
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          REVENUE_CAT_GOOGLE_API_KEY: ${{ secrets.REVENUE_CAT_GOOGLE_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          printf '%s\n' "$DOT_ENV" > .env
          # Premium sold in Google Play (replaces the one of DOT_ENV, if any)
          grep -v '^REVENUE_CAT_GOOGLE_API_KEY=' .env > .env.tmp || true
          mv .env.tmp .env
          printf 'REVENUE_CAT_GOOGLE_API_KEY=%s\n' "$REVENUE_CAT_GOOGLE_API_KEY" >> .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
      - run: flutter pub get
      - run: bundle exec fastlane android beta
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}

  ios:
    needs: test
    if: ${{ inputs.platform != 'android' }}
    # the secrets of the store live in the « Env » environment, not in the repository
    environment: Env
    # Xcode 27 (preview image of GitHub): from April 2027 the App Store takes
    # only apps built with the iOS 27 SDK (ITMS-90725). The app needs the
    # UIScene life cycle for it (Info.plist, AppDelegate.swift): without it,
    # 1.1.11 (17) and 1.1.12 (18) crashed at launch.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      # the iOS 27 SDK, asked by the App Store from April 2027 (connectivity_plus 7
      # needs at least the iOS 26 SDK)
      - name: Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Secrets of the build
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          REVENUE_CAT_APPLE_API_KEY: ${{ secrets.REVENUE_CAT_APPLE_API_KEY }}
        # Premium sold in the App Store (replaces the one of DOT_ENV, if any)
        run: |
          printf '%s\n' "$DOT_ENV" > .env
          grep -v '^REVENUE_CAT_APPLE_API_KEY=' .env > .env.tmp || true
          mv .env.tmp .env
          printf 'REVENUE_CAT_APPLE_API_KEY=%s\n' "$REVENUE_CAT_APPLE_API_KEY" >> .env
      - run: flutter pub get
      - run: bundle exec fastlane ios beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
